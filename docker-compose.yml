services:
  postgresql:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: pdf_importer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

    volumes:
      - pdfextractor_data:/var/lib/postgresql/data

volumes:
  pdfextractor_data:
