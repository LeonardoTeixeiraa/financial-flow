services:
  postgresql:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: pdf_extractor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    labels:
        org.springframework.boot.jdbc.parameters: 'ssl=true&sslmode=require'

    volumes:
      - pdfextractor_data:/var/lib/postgresql/data

volumes:
  pdfextractor_data:
